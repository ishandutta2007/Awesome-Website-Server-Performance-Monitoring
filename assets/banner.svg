<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;overflow:hidden;">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="glowArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .bg-rect { fill: url(#bgGrad); }
    .grid-bg { fill: url(#grid); }
    
    /* Dynamic animated graph line */
    .metric-line {
      fill: none;
      stroke: url(#pulseCyan);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawLine 6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    @keyframes drawLine {
      0% {
        stroke-dashoffset: 1200;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    /* Floating radar beacon animation */
    .radar-circle {
      transform-origin: 1040px 100px;
      animation: radarPulse 3s ease-out infinite;
    }
    @keyframes radarPulse {
      0% {
        r: 6px;
        opacity: 0.9;
      }
      100% {
        r: 42px;
        opacity: 0;
      }
    }

    /* Dynamic particle floating */
    .floating-dot {
      animation: floatPulse 4s ease-in-out infinite alternate;
    }
    @keyframes floatPulse {
      0% {
        transform: translateY(0px);
        opacity: 0.3;
      }
      100% {
        transform: translateY(-8px);
        opacity: 0.8;
      }
    }

    .status-badge {
      animation: blinkGreen 2s ease-in-out infinite;
    }
    @keyframes blinkGreen {
      0%, 100% { fill: #10b981; filter: drop-shadow(0 0 3px #10b981); }
      50% { fill: #059669; filter: drop-shadow(0 0 8px #34d399); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" class="bg-rect" />
  <rect width="100%" height="100%" class="grid-bg" />

  <!-- Background Tech Elements & Flow Curves (Safe in low-z layer) -->
  <g opacity="0.35">
    <!-- Area Chart Gradient Fill -->
    <path d="M 0,330 Q 180,270 340,300 T 700,240 T 960,260 T 1200,220 L 1200,360 L 0,360 Z" fill="url(#glowArea)" />
    <!-- Secondary Server Heartbeat Line -->
    <path d="M 0,310 L 220,310 L 240,280 L 255,335 L 270,300 L 285,310 L 520,310 L 535,270 L 550,330 L 565,305 L 580,310 L 860,310 L 880,260 L 895,340 L 910,290 L 925,310 L 1200,310" 
          fill="none" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- Dynamic Primary Graph Curve (Animated) -->
  <path class="metric-line" filter="url(#neonGlow)"
        d="M 0,330 Q 180,270 340,300 T 700,240 T 960,260 T 1200,220" />

  <!-- Radar Status Widget Top-Right (Dynamic) -->
  <g transform="translate(0, 0)">
    <circle cx="1060" cy="80" r="28" fill="#1e293b" stroke="#334155" stroke-width="1.5" opacity="0.7"/>
    <circle cx="1060" cy="80" class="radar-circle" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="1060" cy="80" r="7" fill="#10b981" class="status-badge" />
    <text x="1060" y="130" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SYSTEMS NORMAL • 99.99%</text>
  </g>

  <!-- Ambient Floating Data Points -->
  <g fill="#38bdf8" class="floating-dot">
    <circle cx="240" cy="280" r="3.5" />
    <circle cx="535" cy="270" r="3.5" />
    <circle cx="880" cy="260" r="3.5" />
  </g>
  <g fill="#34d399" class="floating-dot" style="animation-delay: -2s;">
    <circle cx="340" cy="300" r="3.5" />
    <circle cx="700" cy="240" r="4" />
    <circle cx="960" cy="260" r="3.5" />
  </g>

  <!-- Foreground Title and Content (Clear, high-contrast, strictly in foreground) -->
  <g transform="translate(80, 0)">
    <!-- Pill Category Label -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="5" fill="#38bdf8" />
      <text x="32" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">INFRASTRUCTURE &amp; OBSERVABILITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-1">
      Awesome Website &amp; Server
    </text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Performance Monitoring
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Observability Platforms, Uptime Monitors, APM Tools &amp; Open-Source Telemetry Stacks
    </text>

    <!-- Stat Badges / Feature Highlights (Foreground Pill Boxes) -->
    <g transform="translate(0, 268)">
      <!-- Pill 1 -->
      <g>
        <rect width="138" height="30" rx="8" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="69" y="19" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Real-Time APM</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(148, 0)">
        <rect width="158" height="30" rx="8" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="79" y="19" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🌐 Synthetic Uptime</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(316, 0)">
        <rect width="168" height="30" rx="8" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="84" y="19" text-anchor="middle" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">📊 Open-Source Metrics</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(494, 0)">
        <rect width="160" height="30" rx="8" fill="#1e293b" opacity="0.9" stroke="#334155" stroke-width="1"/>
        <text x="80" y="19" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🛡️ SLA &amp; Incident Ops</text>
      </g>
    </g>
  </g>
</svg>
